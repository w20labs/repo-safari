name: Deploy Repo Safari

# Builds the Repo Safari page and publishes it to GitHub Pages.
# - every push to main: rebuild with the latest data
# - every Monday (and on demand): refresh rooms and rising repos from the GitHub API first
# Refreshed data is saved to the `data` branch, not `main`: main only changes through reviewed
# pull requests, and every build takes the newest data from `data` when it exists.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # the weekly run pushes refreshed data to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: https://w20labs.github.io/repo-safari/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Use the latest saved data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- shared/data/rooms.json shared/data/rising.json
            echo "Using data from the data branch"
          else
            echo "No data branch yet; using the data on main"
          fi

      - name: Refresh rising repos and rooms
        if: github.event_name != 'push'
        run: |
          npm run refresh-rising
          npm run build-rooms

      - name: Build the page
        run: npm run build-safari -- "$SITE_URL" --site _site

      - name: Save refreshed data to the data branch
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data
          git add shared/data/rooms.json shared/data/rising.json
          git commit -m "Data refresh $(date -u +%F)" || echo "No data changes"
          git push --force origin data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
