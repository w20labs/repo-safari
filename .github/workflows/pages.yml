name: Deploy Repo Safari

# Builds the Repo Safari page and publishes it to GitHub Pages.
# - every push to main: rebuild with the latest data
# - every Monday (and on demand): refresh rooms and rising repos from the GitHub API first
# Refreshed data is saved to the `data` branch, not `main`: main only changes through reviewed
# pull requests, and every build takes the newest data from `data` when it exists.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # the weekly run pushes refreshed data to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: https://w20labs.github.io/repo-safari/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Only a data branch that truly doesn't exist yet (the first run) may fall back to the older copies on main. If it
      # exists but can't be fetched or read, stop: deploying, or saving main's older data over it, would lose the last good data.
      - name: Use the latest saved data
        run: |
          set -euo pipefail
          status=0; git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin data
            git checkout FETCH_HEAD -- shared/data/rooms.json shared/data/rising.json
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('shared/data/rooms.json','utf8')); const p=JSON.parse(fs.readFileSync('shared/data/rising.json','utf8')); if (!r.rooms?.length) throw new Error('saved rooms are empty'); if (!Array.isArray(p.repos)) throw new Error('saved rising pool is unreadable')"
            echo "Using data from the data branch"
          elif [ "$status" = 2 ]; then
            echo "No data branch yet (first run); using the data on main"
          else
            echo "::error::Couldn't check for the data branch (git ls-remote exited $status)"; exit 1
          fi

      - name: Refresh rising repos and rooms
        if: github.event_name != 'push'
        run: |
          npm run refresh-rising
          npm run build-rooms

      # IDEAS_URL (a repository variable) turns on the Idea Shower; unset, the page has none. See docs/idea-shower-results.md.
      - name: Build the page
        env:
          IDEAS_URL: ${{ vars.IDEAS_URL }}
        run: npm run build-safari -- "$SITE_URL" --site _site

      - name: Save refreshed data to the data branch
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data
          git add shared/data/rooms.json shared/data/rising.json
          git commit -m "Data refresh $(date -u +%F)" || echo "No data changes"
          git push --force origin data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
