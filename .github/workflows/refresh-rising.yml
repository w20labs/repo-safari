name: Refresh rising repos

# Only for the Fly.io deployment of the original game. Repo Safari's weekly refresh lives in pages.yml.
# Run it by hand once there's a Fly app and a FLY_API_TOKEN secret.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Runs inside the live machine so it writes to the app's SQLite volume.
      # GITHUB_TOKEN / ANTHROPIC_API_KEY come from `fly secrets`, not from this workflow.
      - run: flyctl ssh console --app "${{ vars.FLY_APP || 'last-commit-standing' }}" -C "sh -c 'cd /app && npm run refresh-rising'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
