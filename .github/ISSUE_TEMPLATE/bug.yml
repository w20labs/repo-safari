name: Bug report
description: Something in Repo Safari doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Chrome 140 on Windows
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
