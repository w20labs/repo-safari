# Idea Shower: one Worker, POST /ideas, one Durable Object for rate limits; plus the idea board (off by default).
# Secrets (never in this file): `npx wrangler secret put ANTHROPIC_API_KEY` and `npx wrangler secret put IP_SALT`.
name = "repo-safari-ideas"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false # only the one public address can spend the key

[vars]
REPOS_URL = "https://w20labs.github.io/repo-safari/repos.json"
ALLOWED_ORIGINS = "https://w20labs.github.io"
# The idea board (docs/idea-board.md). "0": no board routes, no drafts, and the schedule does nothing.
# Turn it on together with the site build's BOARD_ENABLED, after the D1 database, OAuth app and secrets below exist.
BOARD_ENABLED = "0"
# GITHUB_CLIENT_ID = "<the GitHub OAuth app's client id>"   # secrets: GITHUB_CLIENT_SECRET, ADMIN_TOKEN

# Rate limits: one Durable Object (src/limiter.ts), so every check-and-count is atomic.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Idea board storage and its hourly contest closing. Uncomment when activating (docs/idea-board.md, "Activation"):
# [[d1_databases]]
# binding = "BOARD_DB"
# database_name = "repo-safari-board"
# database_id = "<from: npx wrangler d1 create repo-safari-board>"
# migrations_dir = "migrations"
#
# [triggers]
# crons = ["0 * * * *"]
